name: Build FitForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crea struttura Android
        run: flutter create --platforms=android --project-name fitforge_coach .

      - name: Configura link apertura app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          deep_link = '''
                <intent-filter>
                    <action android:name="android.intent.action.VIEW"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <category android:name="android.intent.category.BROWSABLE"/>
                    <data android:scheme="fitforge" android:host="open"/>
                </intent-filter>
          '''

          text = text.replace("</activity>", deep_link + "        </activity>", 1)
          path.write_text(text)
          PY

      - name: Installa dipendenze
        run: flutter pub get

      - name: Genera icona FitForge
        run: dart run flutter_launcher_icons

      - name: Crea APK Release
        run: flutter build apk --release

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: FitForge-Coach-APK
          path: build/app/outputs/flutter-apk/app-release.apk
