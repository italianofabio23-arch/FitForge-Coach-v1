name: Build FitForge Web

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crea supporto Web
        run: flutter create --platforms=web --project-name fitforge_coach .

      - name: Installa dipendenze
        run: flutter pub get

      - name: Crea FitForge Web
        run: flutter build web --release --base-href "/FitForge-Coach-v1/app/"

      - name: Copia Web in GitHub Pages
        run: |
          rm -rf docs/app
          mkdir -p docs/app
          cp -R build/web/. docs/app/

      - name: Pubblica Web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app
          if git diff --cached --quiet; then
            echo "Nessuna modifica Web"
          else
            git commit -m "Build FitForge web app"
            git push
          fi
